<!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head {{ HEAD_ATTRS }}>
    {{{ HEAD }}}
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("theme");
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const mode =
            saved === "light" || saved === "dark"
              ? saved
              : prefersDark
              ? "dark"
              : "light";
          if (mode === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body {{ BODY_ATTRS }}>
    {{{ APP }}}
  </body>
</html>
