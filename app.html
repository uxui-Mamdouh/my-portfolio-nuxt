<!DOCTYPE html>
<html lang="en" dir="ltr" {{ HTML_ATTRS }}>
  <head {{ HEAD_ATTRS }}>
    <meta name="google-site-verification" content="LKMGOdlieUwcUH5AuIw1oHe7gHIglY1MIOtRxC90cRc" />
    {{{ HEAD }}}
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("theme");
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const mode =
            saved === "light" || saved === "dark"
              ? saved
              : prefersDark
              ? "dark"
              : "light";
          if (mode === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body {{ BODY_ATTRS }} class="relative">
    {{{ APP }}}
  </body>
</html>
